fragment dateTypeForMobileRichProfile on JobSeekerProfileDateType {
    isCurrent
    month
    year
}

fragment dateRangeForMobileRichProfile on JobSeekerProfileDateRange {
    fromDate {
        isCurrent
        month
        year
    }
    isCurrent
    toDate {
        isCurrent
        month
        year
    }
}

fragment workExperiencesForMobileRichProfile on JobSeekerProfileWorkExperience {
    id
    title
    company
    location {
        country
        formattedLocation
        unknownLocation
    }
    dateRange {
        ... dateRangeForMobileRichProfile
    }
    description
}

fragment educationsForMobileRichProfile on JobSeekerProfileEducation {
    id
    school
    degree {
        degreeName
        field
        id
        taxonomyConceptDegree {
            label
            sectionIds {
                sectionId
            }
            suid
            taxonomyConceptId
            type
            uuid
        }
        taxonomyConceptField {
            label
            sectionIds {
                sectionId
            }
            suid
            taxonomyConceptId
            type
            uuid
        }
    }
    location {
        country
        formattedLocation
        unknownLocation
    }
    dateRange {
        ... dateRangeForMobileRichProfile
    }
    additionalDetails
}

fragment publicationsForMobileRichProfile on JobSeekerProfilePublication {
    id
    date {
        ... dateTypeForMobileRichProfile
    }
    description
    title
    url
}

fragment militaryServiceForMobileRichProfile on JobSeekerProfileMilitary {
    id
    country
    branch
    rank
    description
    serviceCode
    dateRange {
        ... dateRangeForMobileRichProfile
    }
}

fragment patentsForMobileRichProfile on JobSeekerProfilePatent {
    id
    date {
        ... dateTypeForMobileRichProfile
    }
    patentNumber
    description
    title
    url
}

fragment awardsForMobileRichProfile on JobSeekerProfileAward {
    id
    date {
        ... dateTypeForMobileRichProfile
    }
    description
    title
}

fragment associationsForMobileRichProfile on JobSeekerProfileAssociation {
    title
    description
    dateRange {
        ... dateRangeForMobileRichProfile
    }
    id
}

fragment certificationsForMobileRichProfile on JobSeekerProfileCertification {
    title
    description
    dateRange {
        ... dateRangeForMobileRichProfile
    }
    id
}

fragment licensesForMobileRichProfile on JobSeekerProfileLicense {
    title
    endorsements
    metadata {
        collectionTimestamp
    }
    location {
        address
        address2
        admin1
        city
        country
        formattedLocation
        location
        postalCode
        state
    }
    taxonomyConceptTitle {
        label
        suid
    }
    type
    dateRange {
        ... dateRangeForMobileRichProfile
    }
    id

}

fragment languageSkillsForMobileRichProfile on JobSeekerProfileLanguage {
        id
        taxonomyConceptLanguage {
            name
            taxonomyConceptName {
                label
                sectionIds {
                    sectionId
                }
                suid
                taxonomyConceptId
                type
                context {
                    suid
                }
            }
        }
        taxonomyConceptProficiency {
            name
            taxonomyConceptName {
                label
                sectionIds {
                    sectionId
                }
                suid
                taxonomyConceptId
                type
                context {
                    suid
                }
            }
        }
}

fragment resumeLanguage on JobSeekerProfileLanguage {
    id
    taxonomyConceptLanguage {
        ...taxonomyConceptWithName
    }
    taxonomyConceptProficiency {
        ...taxonomyConceptWithName
    }
}

fragment taxonomyConceptWithName on JobSeekerProfileTaxonomyConceptWithName {
    name
    taxonomyConceptName {
        ...taxonomyConcept
    }
}

fragment taxonomyConcept on JobSeekerProfileTaxonomyConcept {
    label
    sectionIds {
        sectionId
    }
    suid
    taxonomyConceptId
    type
    context {
        suid
    }
}


fragment skillsForMobileRichProfile on JobSeekerProfileSkill {
    id
    text
    experience
    timeUnit
    isParentCrowtaxoAttribute
    childAchievementSkill {
        id
        suid
        label
    }
    taxonomyConceptTitle {
        label
        suid
    }
    skillBucket {
        suid
        label
    }
}

fragment workAreasSelectionConfiguration on SegmentationCrowtaxoWorkAreasSelectionConfiguration {
    lever {
        leverId
    }
    workAreaSelection {
        label
        selectionLimit
        workAreas {
            id
            label
        }
    }
}

query GetRichProfileContactInfo {
    jobSeekerProfile {
        profile {
            resume {
                id
                firstName
                lastName
                headline
                phoneNumber
                employmentEligibilities {
                    employmentEligibility
                    id
                }
                showPhoneNumber
                location {
                    address
                    address2
                    admin1
                    city
                    country
                    formattedLocation
                    location
                    postalCode
                    state
                }
            }

            defaultInfo {
                contactInformation {
                    firstName
                    lastName
                    phoneNumber
                    location {
                        address
                        address2
                        admin1
                        city
                        country
                        formattedLocation
                        location
                        postalCode
                        state
                    }
                }
                privacy {
                    sourcingElection
                }
            }
        }
    }
}

