query GetRichProfileResumeData {
    jobSeekerProfile {
        profile {
            resume {
                id
                summary
                additionalInfo
                links {
                    id
                    link
                }
                workExperiences {
                    ... workExperiencesForMobileRichProfile
                }
                publications {
                    ... publicationsForMobileRichProfile
                }
                military {
                    ... militaryServiceForMobileRichProfile
                }
                patents {
                    ... patentsForMobileRichProfile
                }
                awards {
                    ... awardsForMobileRichProfile
                }
                associations {
                    ... associationsForMobileRichProfile
                }
                certifications {
                    ... certificationsForMobileRichProfile
                }
                licenses {
                    ... licensesForMobileRichProfile
                }
                educations {
                    ... educationsForMobileRichProfile
                }
                languages {
                    ... languageSkillsForMobileRichProfile
                }
                skills {
                    ... skillsForMobileRichProfile
                }
            }
            fraudMetadata {
                state
            }
        }
    }
}

