# UDP (User Display Preferences) Interactions

query GetUDPInteractions {
    findUserDisplayPreference {
        userDisplayPreference {
            interactions {
                userInteraction {
                    userInteractionType
                    userInteractionTarget
                    contextKey
                }
                interactionCount
                firstInteractionTimestamp
                lastInteractionTimestamp
            }
        }
    }
}

mutation AddUDPInteraction($input: AddUDPInteractionInput!) {
    userDisplayPreferenceMutations {
        interactionMutations {
            addUDPInteraction(input: $input) {
                userDisplayPreference {
                    interactions {
                        userInteraction {
                            userInteractionType
                            userInteractionTarget
                            contextKey
                        }
                        interactionCount
                        firstInteractionTimestamp
                        lastInteractionTimestamp
                    }
                }
            }
        }
    }
}
