        }
    }
}

query FindSegmentationTargetedLeverExperiments($input: SegmentationTargetedLeverExperimentsInput!) {
  findSegmentationTargetedLeverExperiments(input: $input) {
    leverConfigurations {
		   ... on SegmentationWorkWellbeingConfiguration {
            lever {
                leverId
            }
            workWellbeingQuestions {
                id
                label
                questionAnswerLimit
                attributes {
                    id
                    label
                    customClassIds
                }
            }
          }
       }
  }
}

query FindCategoricalOQVTTaxonomies(
    $taxonomyInput: FindCategoricalOQVTTaxonomiesInput!,
    $genericAttributesInput: CategoricalOQVTGenericAttributesInput!
) {
    findCategoricalOQVTTaxonomies(input: $taxonomyInput) {
        taxonomies {
            genericAttributes (input: $genericAttributesInput){
                id
                label
                question {
                    id
                    label
                    values {
                        id
                        label
                        # get children attributes
                        tag {
                            id
                            label
                        }
                    }
                }
            }
        }
    }
}

