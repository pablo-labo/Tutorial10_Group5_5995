query GetSdcPreferences {
    jobSeekerProfileStructuredData(
        input: { queryFilter: { dataCategories: [CONFIRMED_BY_USER] } }
    ) {
        preferences {
            uuid
            id
            minimumPay {
                id
                amount
                salaryType
                currency
                amountExists
            }
            jobTitles {
                id
                jobTitle
                normalizedValue
                sentiment
            }
            relocation {
                ableToRelocate
                source
            }
            locations {
                id
                formattedLocationFull
                formattedLocationShort
                raw
            }
            maximumCommute {
                timeMinutes
            }
        }
    }
}

